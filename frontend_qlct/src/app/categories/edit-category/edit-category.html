<div class="basic">
  <div class="basic-header">
    <h2 class="basic-title">Edit Category</h2>
    <button class="basic-btn-secondary" routerLink="/list-category">
      <span class="material-symbols-outlined">arrow_back</span>
      Back to List
    </button>
  </div>

  @if (isLoading) {
    <div class="basic-loading">Loading category data...</div>
  } @else {
    <form class="basic-form" (ngSubmit)="onSubmit()">
      <div class="basic-form-group">
        <label class="basic-label" for="categoryName">Category Name <span class="basic-required">*</span></label>
        <input type="text" id="categoryName" class="basic-input" name="name" [(ngModel)]="category.name" placeholder="e.g. Groceries" required>
      </div>

      <div class="basic-form-group">
        <label class="basic-label" for="categoryIcon">Icon Name (Material Symbols) <span class="basic-required">*</span></label>
        <input type="text" id="categoryIcon" class="basic-input" name="icon" [(ngModel)]="category.icon" placeholder="e.g. shopping_cart" required>
        @if (category.icon) {
          <div class="basic-icon-preview">
            Preview: <span class="material-symbols-outlined">{{ category.icon }}</span>
          </div>
        }
      </div>

      <div class="basic-form-group">
        <label class="basic-label" for="categoryType">Category Type</label>
        <select id="categoryType" class="basic-input" name="type" [(ngModel)]="category.type">
          <option value="EXPENSE">Expense</option>
          <option value="INCOME">Income</option>
        </select>
      </div>

      <div class="basic-form-actions">
        <button type="button" class="basic-btn-outline" routerLink="/list-category">Cancel</button>
        <button type="submit" class="basic-btn">Update Category</button>
      </div>
    </form>
  }
</div>
