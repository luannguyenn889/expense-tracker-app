<nav class="sidebar">
  <!-- Logo -->
  <div class="sidebar__brand" routerLink="/" style="cursor: pointer;">
    <div class="sidebar__brand-row">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="sidebar__logo-img logo-svg" style="width: 40px; height: 40px; display: block;">
        <defs>
          <linearGradient id="logoGradSidebar" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4F46E5" />
            <stop offset="100%" stop-color="#06B6D4" />
          </linearGradient>
        </defs>
        <rect width="24" height="24" rx="6" fill="url(#logoGradSidebar)" />
        <path d="M6 13 L9 17 L12 12 L15 16 L18 8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M14 8 H18 V12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div>
        <h1 class="sidebar__title">WealthWise</h1>
        <p class="sidebar__subtitle">Personal Finance Manager</p>
      </div>
    </div>
  </div>

  <!-- Navigation Links -->
  <div class="sidebar__nav">
    <a class="sidebar__link" routerLink="/" routerLinkActive="sidebar__link--active" [routerLinkActiveOptions]="{ exact: true }">
      <span class="material-symbols-outlined">dashboard</span>
      Dashboard
    </a>
    <a class="sidebar__link" routerLink="/transactions" routerLinkActive="sidebar__link--active">
      <span class="material-symbols-outlined">receipt_long</span>
      Transactions
    </a>
    <a class="sidebar__link" routerLink="/categories" routerLinkActive="sidebar__link--active">
      <span class="material-symbols-outlined">category</span>
      Categories
    </a>
    <a class="sidebar__link" routerLink="/wallets" routerLinkActive="sidebar__link--active">
      <span class="material-symbols-outlined">account_balance_wallet</span>
      Wallets
    </a>
    <a class="sidebar__link" routerLink="/budget" routerLinkActive="sidebar__link--active">
      <span class="material-symbols-outlined">target</span>
      Budget
    </a>
    <a class="sidebar__link" routerLink="/saving-goals" routerLinkActive="sidebar__link--active">
      <span class="material-symbols-outlined">savings</span>
      Saving Goals
    </a>
    <a class="sidebar__link" routerLink="/reports" routerLinkActive="sidebar__link--active">
      <span class="material-symbols-outlined">bar_chart</span>
      Reports
    </a>
    <a class="sidebar__link" routerLink="/settings" routerLinkActive="sidebar__link--active">
      <span class="material-symbols-outlined">settings</span>
      Settings
    </a>
  </div>

  <!-- New Transaction Button -->
  <div class="sidebar__footer">
    <button class="sidebar__new-btn" (click)="openNewTransaction()">
      <span class="material-symbols-outlined">add</span>
      New Transaction
    </button>
  </div>
</nav>
