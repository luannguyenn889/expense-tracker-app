<div class="modal-overlay">
  <div class="transfer-modal">
    <h3>Chuyển tiền</h3>

    <div class="form-group">
      <label>Ví gửi</label>
      <select [(ngModel)]="transferData.fromWalletId">
        <option [value]="null">-- Chọn ví gửi --</option>
        <option *ngFor="let wallet of wallets" [value]="wallet.id">
          {{ wallet.name }} ({{ wallet.balance | number:'1.0-0' }} ₫)
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Ví nhận</label>
      <select [(ngModel)]="transferData.toWalletId">
        <option [value]="null">-- Chọn ví nhận --</option>
        <option *ngFor="let wallet of wallets" [value]="wallet.id">
          {{ wallet.name }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Số tiền</label>
      <input type="number" [(ngModel)]="transferData.amount" placeholder="0" />
    </div>

    <div class="form-group">
      <label>Nội dung</label>
      <input [(ngModel)]="transferData.note" placeholder="Ghi chú" />
    </div>

    <div class="modal-actions">
      <button class="cancel-btn" (click)="cancel()">Hủy</button>
      <button class="save-btn" (click)="transfer()" [disabled]="!isValid()">Xác nhận</button>
    </div>
  </div>
</div>
