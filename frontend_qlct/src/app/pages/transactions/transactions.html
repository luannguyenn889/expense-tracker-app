<div class="transactions-container">
  <div class="header-actions">
    <h2>Giao dịch</h2>
    <div class="btn-group">
      <button class="btn-transfer" (click)="openTransferModal()">
        <span class="material-symbols-outlined">swap_horiz</span>
        Chuyển tiền
      </button>
      <button class="btn-add" (click)="openAddTransaction()">
        <span class="material-symbols-outlined">add</span>
        Thêm giao dịch
      </button>
    </div>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label>Từ</label>
      <input type="date" [(ngModel)]="filter.startDate" />
    </div>
    <div class="filter-group">
      <label>Đến</label>
      <input type="date" [(ngModel)]="filter.endDate" />
    </div>
    <div class="filter-group">
      <label>Loại</label>
      <select [(ngModel)]="filter.type">
        <option value="">Tất cả</option>
        <option value="INCOME">Thu</option>
        <option value="EXPENSE">Chi</option>
        <option value="TRANSFER">Chuyển tiền</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Ví</label>
      <select [(ngModel)]="filter.walletId">
        <option [value]="null">Tất cả ví</option>
        <option *ngFor="let wallet of allWallets" [value]="wallet.id">{{ wallet.name }}</option>
      </select>
    </div>
    <div class="filter-actions">
      <button (click)="search()" class="btn-search">
        <span class="material-symbols-outlined">search</span>
        Tìm kiếm
      </button>
      <button (click)="clearFilter()" class="btn-clear">
        <span class="material-symbols-outlined">clear</span>
        Xóa lọc
      </button>
    </div>
  </div>

  <app-list-transaction
    [transactions]="transactions"
    [wallets]="allWallets"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChange)="changePage($event)"
    (edit)="openEditModal($event)"
    (delete)="deleteTransaction($event)">
  </app-list-transaction>
</div>

<!-- POPUP THÊM GIAO DỊCH -->
<app-add-transaction
  *ngIf="showAddModal"
  [wallets]="wallets"
  [categories]="categories"
  (close)="closeAddModal()"
  (added)="onTransactionAdded($event)">
</app-add-transaction>

<!-- POPUP SỬA GIAO DỊCH -->
<app-edit-transaction
  *ngIf="showEditModal"
  [transaction]="selectedTransaction"
  [wallets]="wallets"
  [categories]="categories"
  (close)="closeEditModal()"
  (updated)="onTransactionUpdated()">
</app-edit-transaction>

<!-- POPUP CHUYỂN TIỀN -->
<app-transfer
  *ngIf="showTransferModal"
  [wallets]="wallets"
  (close)="closeTransferModal()"
  (completed)="onTransferCompleted()">
</app-transfer>

<div class="custom-toast-container" *ngIf="toastMessage">
  <div class="custom-toast" [ngClass]="{
      'toast-warning': toastType === 'WARNING',
      'toast-danger': toastType === 'DANGER',
      'toast-success': toastType === 'SUCCESS'
    }">
    <span class="material-symbols-outlined toast-icon">
      {{ toastType === 'SUCCESS' ? 'check_circle' : (toastType === 'DANGER' ? 'error' : 'warning') }}
    </span>
    <div class="toast-content">
      <strong>{{ toastType === 'SUCCESS' ? 'Thành công' : 'Cảnh báo Ngân sách' }}</strong>
      <p>{{ toastMessage }}</p>
    </div>
    <button class="toast-close" (click)="toastMessage = ''">&times;</button>
  </div>
</div>
