<div class="wallets-container">
  <h2>Ví của tôi</h2>

  <div class="total-balance" *ngIf="!isLoading && wallets.length > 0">
    <h3>Tổng số dư</h3>
    <p class="total-amount">{{ getTotalBalance() | number:'1.0-0' }} ₫</p>
  </div>

  <button class="btn-add-wallet" (click)="openAddModal()">+ Thêm ví</button>

  <app-list-wallet 
    [wallets]="wallets"
    (edit)="openEditModal($event)"
    (delete)="deleteWallet($event)">
  </app-list-wallet>

  <div class="empty-state" *ngIf="!isLoading && wallets.length === 0">
    <h3>Chưa có ví nào!</h3>
    <p>Hãy nhấn nút "Thêm ví" để bắt đầu.</p>
  </div>

  <div class="loading" *ngIf="isLoading">Đang tải...</div>
</div>

<app-add-wallet 
  *ngIf="showAddModal"
  [userId]="userId"
  (close)="closeAddModal()"
  (added)="onWalletAdded()">
</app-add-wallet>

<app-edit-wallet 
  *ngIf="showEditModal"
  [wallet]="selectedWallet"
  [userId]="userId"
  (close)="closeEditModal()"
  (updated)="onWalletUpdated()">
</app-edit-wallet>
